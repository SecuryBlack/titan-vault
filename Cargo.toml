[package]
name = "titan-vault"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
description = "SecuryBlack storage, backup and disaster recovery agent"
repository = "https://github.com/securyblack/titan-vault"

[[bin]]
name = "titanvault"
path = "src/main.rs"

[dependencies]
sb-agent-core = { git = "https://github.com/securyblack/sb-agent-core", branch = "main" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
rand = "0.8"
sha2 = "0.10"
chacha20poly1305 = "0.10"
zstd = "0.13"
tar = "0.4"
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
opendal = { version = "0.59", features = ["services-s3", "services-fs"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[profile.release]
opt-level = 3
lto = true
strip = true
